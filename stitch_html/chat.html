<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Digital Sanctuary | Chat</title>

                    "clay": "#D9D2C9",
                    "outline": "#747872",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary": "#ffffff",
                    "inverse-on-surface": "#f1f1ef",
                    "sage-muted": "#7D8C7C",
                    "primary": "#516051",
                    "lavender-hush": "#E6E6FA",
                    "inverse-primary": "#bbcbb9",
                    "secondary-fixed": "#e6e2dc",
                    "error": "#ba1a1a",
                    "tertiary-container": "#677684",
                    "primary-container": "#6a7869",
                    "tertiary-fixed": "#d4e4f4",
                    "on-error": "#ffffff",
                    "surface-variant": "#e3e2e0",
                    "on-primary-fixed-variant": "#3c4a3d",
                    "on-primary-fixed": "#121e13",

                    "on-primary": "#ffffff",

                    "on-tertiary-fixed": "#0d1d28",
                    "outline-variant": "#c4c8c0",
                    "surface-container-low": "#f4f3f1",
                    "surface-container": "#efeeec",
                    "on-primary-container": "#f7fff3",

                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]

          },
        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .breathing-companion {
            animation: breathe 4s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 0.9; }
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-chat-mint font-body-md text-on-surface overflow-x-hidden">
<!-- Header / TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-ivory/80 backdrop-blur-xl flex flex-col items-center pt-4 pb-2">
<div class="flex items-center justify-between px-gutter w-full h-12">
<button class="active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<div class="relative">
<img alt="Maya's Avatar" class="w-10 h-10 rounded-full object-cover" data-alt="A close-up portrait of a serene woman named Maya with a warm, natural expression. She has soft features and is set against a blurred, peaceful garden background. The lighting is golden hour, soft and ethereal, reflecting a digital sanctuary aesthetic with high-key whites and muted earthy tones of sage and clay. The mood is calm, intentional, and welcoming." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBBcpUzo6j5cFG8M3Sil6JnklBnTDAvAbvf7HSbtEr35VRcE5aq0a1-4-QeoXCcE9lpVlrAz6iyN78Sy1KCe6sX5Sx2932w_gAWPeVQCKEOQLFEZvmz-5GPwl5XI-f66kNJ59mW0Z5HHX8LEwQhStYMXoXrv6RzReQ-MxdlleAt35fOjaeRbDADyaCIJBVhrJQ0ferAkATEndaDtDvdT0Vxu2AsREQrHEIlAGPuqAQQZUQVbyOi_koU6cpLK0tT3QtWdYBzVJqWwiLJ"/>
<div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-ivory rounded-full"></div>
</div>
</div>
<button class="active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-primary" data-icon="settings">settings</span>
</button>
</div>
<div class="flex flex-col items-center mt-1">
<div class="flex items-center gap-1.5">
<span class="font-headline-md text-label-md text-on-surface font-medium">Maya</span>
<div class="w-1.5 h-1.5 bg-green-500 rounded-full"></div>
</div>
<div class="mt-2 px-3 py-0.5 rounded-full border border-chat-gold bg-transparent">
<span class="text-chat-gold font-label-sm text-[10px]">2 New Messages</span>
</div>
</div>
</header>
<!-- Chat Canvas -->
<main class="pt-40 pb-32 px-gutter max-w-[800px] mx-auto min-h-screen">
<!-- Timestamp Separator -->
<div class="flex justify-center mb-8">
<div class="bg-ivory border border-chat-gold/20 px-4 py-1.5 rounded-full shadow-sm">
<p class="text-chat-gold font-label-sm text-[11px]">Maya: Check this out! 11:32 AM</p>
</div>
</div>
<!-- Received Message -->
<div class="flex flex-col items-start mb-6 w-full animate-in fade-in slide-in-from-left-4 duration-500">
<div class="relative bg-white border-l-4 border-chat-gold px-4 py-3 rounded-tr-2xl rounded-br-2xl rounded-bl-lg shadow-sm max-w-[85%]">
<p class="text-on-surface text-body-md leading-relaxed">
                    Maya: The team huddle notes from earlier are perfect! 😊
                </p>
<!-- Unread Badge -->
<div class="absolute -top-2 -right-2 bg-chat-gold text-white text-[9px] w-4 h-4 flex items-center justify-center rounded-full font-bold">
                    2
                </div>
</div>
<span class="mt-1 text-on-surface-variant/40 font-label-sm text-[10px] ml-1">11:33 AM</span>
</div>
<!-- Sent Message 1 -->
<div class="flex flex-col items-end mb-4 w-full animate-in fade-in slide-in-from-right-4 duration-500 delay-150">
<div class="bg-primary text-white px-4 py-3 rounded-tl-2xl rounded-bl-2xl rounded-br-lg shadow-sm max-w-[85%]">
<p class="text-body-md leading-relaxed">
                    Sarah: I'm looking at it now!
                </p>
</div>
<span class="mt-1 text-on-surface-variant/40 font-label-sm text-[10px] mr-1">11:35 AM</span>
</div>
<!-- Sent Message 2 -->
<div class="flex flex-col items-end mb-8 w-full animate-in fade-in slide-in-from-right-4 duration-500 delay-300">
<div class="bg-white text-on-surface px-4 py-3 rounded-tl-2xl rounded-bl-2xl rounded-br-lg shadow-sm max-w-[85%]">
<p class="text-body-md leading-relaxed">
                    Sarah: Sounds good!
                </p>
</div>
</div>
</main>
<!-- Floating Input Dock -->
<div class="fixed bottom-20 left-0 w-full px-gutter z-40 max-w-[800px] mx-auto left-1/2 -translate-x-1/2">
<div class="bg-white/90 backdrop-blur-xl rounded-full h-14 flex items-center px-2 shadow-lg border border-white/20">
<button class="p-2 text-on-surface-variant/60 hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="attachment">attachment</span>
</button>
<input class="flex-1 bg-transparent border-none focus:ring-0 text-body-md placeholder-on-surface-variant/40" placeholder="Message Maya..." type="text"/>
<button class="p-2 text-on-surface-variant/60 hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
</button>
<button class="ml-1 w-10 h-10 bg-primary text-white rounded-full flex items-center justify-center active:scale-90 transition-transform shadow-md">
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
</div>
</div>
<!-- Emotional Companion (Atmospheric) -->
<div class="fixed bottom-36 right-6 z-50">
<div class="breathing-companion w-10 h-10 rounded-full bg-white/40 backdrop-blur-md flex items-center justify-center border border-white/30 shadow-sm cursor-pointer">
<div class="w-4 h-4 bg-sage-muted/30 rounded-full"></div>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-ivory/80 backdrop-blur-xl shadow-[0_-10px_40px_rgba(0,0,0,0.04)]">
<div class="flex justify-around items-center px-4 py-2 w-full max-w-[800px] mx-auto relative">
<!-- Navigation Items -->
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 p-2 hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="spa">spa</span>
<span class="font-label-sm text-label-sm">Sanctuary</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container/20 text-primary rounded-xl p-2 active:scale-90 transition-transform duration-200">
<div class="absolute top-0 w-12 h-1 bg-primary rounded-full mb-1"></div>
<span class="material-symbols-outlined" data-icon="self_improvement">self_improvement</span>
<span class="font-label-sm text-label-sm">Reflect</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 p-2 hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="auto_stories">auto_stories</span>
<span class="font-label-sm text-label-sm">Journey</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 p-2 hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-sm text-label-sm">Circle</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant/60 p-2 hover:text-primary transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</button>
</div>
</nav>
<script>
        // Micro-interactions for input focus
        const input = document.querySelector('input');
        const inputDock = input.closest('div');

        input.addEventListener('focus', () => {
            inputDock.classList.add('ring-2', 'ring-sage-muted/20', 'scale-[1.02]');
            inputDock.classList.remove('shadow-lg');
            inputDock.classList.add('shadow-xl');
        });

        input.addEventListener('blur', () => {
            inputDock.classList.remove('ring-2', 'ring-sage-muted/20', 'scale-[1.02]');
            inputDock.classList.add('shadow-lg');
            inputDock.classList.remove('shadow-xl');
        });

        // Atmospheric breathing effect interaction
        const companion = document.querySelector('.breathing-companion');
        companion.addEventListener('click', () => {
            companion.style.transform = 'scale(1.5)';
            companion.style.backgroundColor = 'rgba(125, 140, 124, 0.2)';
            setTimeout(() => {
                companion.style.transform = '';
                companion.style.backgroundColor = '';
            }, 500);
        });
    </script>
</body></html>
